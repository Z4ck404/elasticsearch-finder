[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elasticsearch-finder"
version = "2.0.0"
description = "A tool to find open Elasticsearch instances for bug bounty"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zakaria EL BAZI", email = "z4ck404@protonmail.com"}
]
keywords = ["elasticsearch", "bug-bounty", "security", "shodan", "binaryedge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.9"
dependencies = [
    "shodan>=1.28.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "colorama>=0.4.6",
    "hurry.filesize>=0.9",
    "urllib3>=2.0.0",
    "termcolor>=2.3.0",
    "xlsxwriter>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "responses>=0.24.0",
    "ruff>=0.3.0",
]

[project.scripts]
esf = "elasticsearch_finder.cli:main"

[project.urls]
Homepage = "https://github.com/Z4ck404/elasticsearch-finder"
Repository = "https://github.com/Z4ck404/elasticsearch-finder"
Issues = "https://github.com/Z4ck404/elasticsearch-finder/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "S"]
ignore = ["S101"]  # Allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=elasticsearch_finder --cov-report=term-missing"
